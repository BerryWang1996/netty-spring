<!-- ⚠️ Publish gate: this document references 1.10.1. The published 1.10.0 cluster starter crashes at startup on the default classpath without jnats (fixed locally, commit 15a25d7). Do not publish this document until 1.10.1 is on Maven Central. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="t d">
  <title id="t">netty-spring deployment topologies</title>
  <desc id="d">Three ways to run netty-spring: single node (default), opt-in Redis Pub/Sub cluster for roughly up to 10 nodes on a dedicated, secured Redis, and opt-in node-to-node mesh transport. Ceilings: ≤~10 nodes, dedicated secured Redis, interest-partitioned-only fan-out reduction.</desc>
  <defs>
    <marker id="arrE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6470"/></marker>
    <marker id="arrS" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#5b6470"/></marker>
    <marker id="arrTE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f7d5b"/></marker>
    <marker id="arrTS" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#2f7d5b"/></marker>
  </defs>
  <g font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
    <rect x="0" y="0" width="1400" height="520" fill="#ffffff"/>

    <!-- Title -->
    <text x="20" y="30" font-size="18" font-weight="700" fill="#1d2a3a">netty-spring — deployment topologies</text>
    <text x="20" y="48" font-size="11" fill="#5b6470">Spring Boot 2.7 · JDK 17 · runs its own Netty server (server.netty.port) — not Tomcat</text>

    <!-- Panels -->
    <rect x="20" y="56" width="440" height="392" rx="10" fill="#f6f7f9" stroke="#d9dde3"/>
    <rect x="480" y="56" width="440" height="392" rx="10" fill="#f6f7f9" stroke="#d9dde3"/>
    <rect x="940" y="56" width="440" height="392" rx="10" fill="#f6f7f9" stroke="#d9dde3"/>

    <!-- ================= Panel 1: Single node ================= -->
    <text x="40" y="82" font-size="14" font-weight="700" fill="#24324a">Single node (default)</text>

    <rect x="130" y="112" width="64" height="30" rx="6" fill="#f3f4f6" stroke="#9aa1ab"/>
    <text x="162" y="131" font-size="10" fill="#4a5059" text-anchor="middle">browser</text>
    <rect x="208" y="112" width="64" height="30" rx="6" fill="#f3f4f6" stroke="#9aa1ab"/>
    <text x="240" y="131" font-size="10" fill="#4a5059" text-anchor="middle">mobile</text>
    <rect x="286" y="112" width="64" height="30" rx="6" fill="#f3f4f6" stroke="#9aa1ab"/>
    <text x="318" y="131" font-size="10" fill="#4a5059" text-anchor="middle">browser</text>

    <line x1="162" y1="142" x2="162" y2="206" stroke="#6b7280" marker-end="url(#arrE)"/>
    <line x1="240" y1="142" x2="240" y2="206" stroke="#6b7280" marker-end="url(#arrE)"/>
    <line x1="318" y1="142" x2="318" y2="206" stroke="#6b7280" marker-end="url(#arrE)"/>

    <rect x="60" y="210" width="360" height="90" rx="8" fill="#eaf1fb" stroke="#2f6fb2"/>
    <text x="240" y="246" font-size="14" font-weight="700" fill="#1d3a5f" text-anchor="middle">Netty node</text>
    <text x="240" y="266" font-size="12" fill="#1d3a5f" text-anchor="middle">HTTP MVC + WebSocket</text>
    <text x="240" y="286" font-size="11" fill="#5b6470" text-anchor="middle">sessions local</text>

    <rect x="150" y="318" width="180" height="32" rx="6" fill="none" stroke="#c2c8d0" stroke-dasharray="4 3"/>
    <text x="240" y="339" font-size="11" fill="#9aa1ab" text-anchor="middle">Redis (not used)</text>
    <text x="240" y="378" font-size="10" fill="#6b7280" text-anchor="middle">zero broker overhead</text>

    <!-- ================= Panel 2: Cluster mode ================= -->
    <text x="500" y="82" font-size="14" font-weight="700" fill="#24324a">Cluster mode (opt-in, ≤ ~10 nodes)</text>

    <rect x="616" y="112" width="64" height="30" rx="6" fill="#f3f4f6" stroke="#9aa1ab"/>
    <text x="648" y="131" font-size="10" fill="#4a5059" text-anchor="middle">browser</text>
    <rect x="688" y="112" width="64" height="30" rx="6" fill="#f3f4f6" stroke="#9aa1ab"/>
    <text x="720" y="131" font-size="10" fill="#4a5059" text-anchor="middle">mobile</text>
    <line x1="648" y1="142" x2="648" y2="148" stroke="#6b7280" marker-end="url(#arrE)"/>
    <line x1="720" y1="142" x2="720" y2="148" stroke="#6b7280" marker-end="url(#arrE)"/>

    <rect x="580" y="150" width="200" height="40" rx="8" fill="#eef0f3" stroke="#5b6470"/>
    <text x="680" y="175" font-size="12" font-weight="700" fill="#2b3240" text-anchor="middle">nginx / load balancer</text>

    <line x1="680" y1="190" x2="680" y2="206" stroke="#6b7280"/>
    <line x1="558" y1="206" x2="842" y2="206" stroke="#6b7280"/>
    <line x1="558" y1="206" x2="558" y2="226" stroke="#6b7280" marker-end="url(#arrE)"/>
    <line x1="700" y1="206" x2="700" y2="226" stroke="#6b7280" marker-end="url(#arrE)"/>
    <line x1="842" y1="206" x2="842" y2="226" stroke="#6b7280" marker-end="url(#arrE)"/>

    <rect x="500" y="230" width="116" height="55" rx="8" fill="#eaf1fb" stroke="#2f6fb2"/>
    <text x="558" y="262" font-size="12" font-weight="700" fill="#1d3a5f" text-anchor="middle">node A</text>
    <rect x="642" y="230" width="116" height="55" rx="8" fill="#eaf1fb" stroke="#2f6fb2"/>
    <text x="700" y="262" font-size="12" font-weight="700" fill="#1d3a5f" text-anchor="middle">node B</text>
    <rect x="784" y="230" width="116" height="55" rx="8" fill="#eaf1fb" stroke="#2f6fb2"/>
    <text x="842" y="262" font-size="12" font-weight="700" fill="#1d3a5f" text-anchor="middle">node C</text>

    <rect x="590" y="320" width="220" height="82" rx="8" fill="#fbecee" stroke="#b0444f"/>
    <text x="700" y="340" font-size="13" font-weight="700" fill="#7a2c33" text-anchor="middle">Redis — dedicated, secured</text>
    <line x1="612" y1="348" x2="788" y2="348" stroke="#e0b8bd"/>
    <text x="700" y="364" font-size="11" fill="#7a2c33" text-anchor="middle">session registry</text>
    <text x="700" y="380" font-size="11" fill="#7a2c33" text-anchor="middle">Pub/Sub transport</text>
    <text x="700" y="396" font-size="10" fill="#9a4a54" text-anchor="middle">auth + TLS in prod</text>

    <line x1="558" y1="285" x2="638" y2="318" stroke="#6b7280" marker-start="url(#arrS)" marker-end="url(#arrE)"/>
    <line x1="700" y1="285" x2="700" y2="318" stroke="#6b7280" marker-start="url(#arrS)" marker-end="url(#arrE)"/>
    <line x1="842" y1="285" x2="762" y2="318" stroke="#6b7280" marker-start="url(#arrS)" marker-end="url(#arrE)"/>

    <text x="700" y="408" font-size="11" fill="#5b6470" text-anchor="middle">local first, never lost · cross-node at-most-once</text>
    <text x="700" y="424" font-size="11" fill="#5b6470" text-anchor="middle">Redis lost → degrade to local after grace</text>
    <text x="700" y="440" font-size="11" fill="#5b6470" text-anchor="middle">unicast gone → MessageSessionClosedException</text>

    <!-- ================= Panel 3: Mesh transport ================= -->
    <text x="960" y="82" font-size="14" font-weight="700" fill="#24324a">Mesh transport (opt-in)</text>
    <line x1="960" y1="102" x2="1010" y2="102" stroke="#2f7d5b" stroke-width="2"/>
    <text x="1020" y="106" font-size="10" fill="#2f7d5b">direct Netty TCP</text>

    <rect x="1100" y="144" width="120" height="52" rx="8" fill="#eaf1fb" stroke="#2f6fb2"/>
    <text x="1160" y="174" font-size="12" font-weight="700" fill="#1d3a5f" text-anchor="middle">node A</text>
    <rect x="990" y="244" width="120" height="52" rx="8" fill="#eaf1fb" stroke="#2f6fb2"/>
    <text x="1050" y="274" font-size="12" font-weight="700" fill="#1d3a5f" text-anchor="middle">node B</text>
    <rect x="1210" y="244" width="120" height="52" rx="8" fill="#eaf1fb" stroke="#2f6fb2"/>
    <text x="1270" y="274" font-size="12" font-weight="700" fill="#1d3a5f" text-anchor="middle">node C</text>

    <line x1="1120" y1="196" x2="1050" y2="242" stroke="#2f7d5b" marker-start="url(#arrTS)" marker-end="url(#arrTE)"/>
    <line x1="1200" y1="196" x2="1270" y2="242" stroke="#2f7d5b" marker-start="url(#arrTS)" marker-end="url(#arrTE)"/>
    <line x1="1110" y1="270" x2="1210" y2="270" stroke="#2f7d5b" marker-start="url(#arrTS)" marker-end="url(#arrTE)"/>

    <line x1="1160" y1="196" x2="1160" y2="336" stroke="#9aa1ab" stroke-dasharray="4 3"/>
    <line x1="1050" y1="296" x2="1084" y2="336" stroke="#9aa1ab" stroke-dasharray="4 3"/>
    <line x1="1270" y1="296" x2="1236" y2="336" stroke="#9aa1ab" stroke-dasharray="4 3"/>

    <rect x="1040" y="338" width="240" height="66" rx="8" fill="#fbecee" stroke="#b0444f"/>
    <text x="1160" y="354" font-size="12" font-weight="700" fill="#7a2c33" text-anchor="middle">Redis</text>
    <text x="1160" y="372" font-size="10" fill="#7a2c33" text-anchor="middle">registry + heartbeat + discovery</text>
    <text x="1160" y="388" font-size="10" fill="#7a2c33" text-anchor="middle">+ interest registry (off the message hot path)</text>

    <text x="1160" y="420" font-size="11" fill="#5b6470" text-anchor="middle">fan-out reduction genuine only for interest-partitioned audiences —</text>
    <text x="1160" y="436" font-size="11" fill="#5b6470" text-anchor="middle">global/high-population topics under random LB still saturate the fleet</text>

    <!-- Footer -->
    <line x1="20" y1="472" x2="1380" y2="472" stroke="#d9dde3"/>
    <text x="700" y="498" font-size="12" fill="#4a5059" text-anchor="middle">netty-spring 1.10.1 — ceilings: ≤~10 nodes · dedicated secured Redis · interest-partitioned-only fan-out reduction</text>
  </g>
</svg>