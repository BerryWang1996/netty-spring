name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 20 * * 1"

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  MAVEN_ARGS: "-B -ntp"

jobs:
  test:
    name: Maven Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Run tests
        # Cluster integration tests self-provision Redis via Testcontainers (ClusterTestRedis prefers
        # a reachable localhost:16379 and otherwise starts a redis:7-alpine container using the
        # runner's Docker). Do NOT add a Redis service here — it would be unused.
        run: bash ./mvnw $MAVEN_ARGS test

      - name: Verify complete test execution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          totals = dict.fromkeys(("tests", "failures", "errors", "skipped"), 0)
          reports = list(Path(".").glob("*/target/surefire-reports/TEST-*.xml"))
          for report in reports:
              suite = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(suite.attrib.get(key, 0))
          print(f"Surefire reports={len(reports)} totals={totals}")
          if not totals["tests"] or any(totals[key] for key in ("failures", "errors", "skipped")):
              raise SystemExit("All regression tests must execute successfully, including middleware tests.")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk-${{ matrix.java }}
          path: "*/target/surefire-reports/**"
          if-no-files-found: warn

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Generate CycloneDX SBOM
        run: bash ./mvnw $MAVEN_ARGS -Psbom -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: netty-spring-sbom
          path: |
            target/netty-spring-sbom.json
            target/netty-spring-sbom.xml
          if-no-files-found: error

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/v')
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Cache Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.m2/dependency-check-data
          key: ${{ runner.os }}-dependency-check-${{ hashFiles('pom.xml', 'dependency-check-suppressions.xml') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-

      - name: Validate NVD mirror freshness when no API key is configured
        if: env.NVD_API_KEY == ''
        run: |
          python3 - <<'PY'
          import os
          from datetime import datetime, timedelta, timezone
          from urllib.request import Request, urlopen

          base = "https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/"
          request = Request(base + "cache.properties", headers={"Cache-Control": "no-cache"})
          with urlopen(request, timeout=30) as response:
              metadata = response.read(65536).decode("utf-8")
          timestamps = [line.split("=", 1)[1].strip() for line in metadata.splitlines()
                        if line.startswith("lastModifiedDate=")]
          if len(timestamps) != 1:
              raise SystemExit("::error::NVD mirror has no unique lastModifiedDate; scan gate blocked.")
          updated = datetime.fromisoformat(timestamps[0].replace("\\:", ":").replace("Z", "+00:00"))
          if updated.utcoffset() is None:
              raise SystemExit("::error::NVD mirror timestamp has no timezone; scan gate blocked.")
          age = datetime.now(timezone.utc) - updated
          if age > timedelta(hours=72) or age < -timedelta(minutes=5):
              raise SystemExit("::error::NVD mirror is older than 72 hours or dated in the future; scan gate blocked.")
          print(f"NVD mirror lastModifiedDate={updated.isoformat()} (age={age.total_seconds() / 3600:.1f} hours)")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("NVD_DATAFEED_URL=" + base + "nvdcve-{0}.json.gz\n")
          PY

      - name: Run Dependency-Check
        run: |
          scan_args=()
          if [[ -n "${NVD_DATAFEED_URL:-}" ]]; then
            scan_args+=("-DnvdDatafeedUrl=$NVD_DATAFEED_URL")
          fi
          bash ./mvnw $MAVEN_ARGS -Pdependency-scan -DskipTests package org.owasp:dependency-check-maven:12.2.2:aggregate "${scan_args[@]}"

      - name: Upload Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check/**
          if-no-files-found: warn
